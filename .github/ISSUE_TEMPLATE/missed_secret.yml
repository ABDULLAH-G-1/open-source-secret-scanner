name: Missed Secret Report
description: Report a real-world secret or credential pattern that CloakKit missed
title: "[Missed Secret]: "
labels: ["enhancement", "missed-secret"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **CRITICAL SECURITY WARNING**:
        DO NOT paste actual, active, or real secrets into this issue!
        Replace any specific characters with synthetic placeholders (e.g. `'sk-proj-' + 'x'.repeat(40)`).
  - type: input
    id: provider_name
    attributes:
      label: Service Provider & Token Type
      description: The service provider and credential type (e.g. Hugging Face Access Token, HashiCorp Vault Token).
      placeholder: "e.g. Hugging Face Access Token (hf_...)"
    validations:
      required: true
  - type: input
    id: documentation_url
    attributes:
      label: Official Documentation URL
      description: Link to official provider docs detailing the token structure or prefix.
      placeholder: "https://huggingface.co/docs/hub/security-tokens"
    validations:
      required: true
  - type: textarea
    id: synthetic_example
    attributes:
      label: Synthetic / Fake Example
      description: Provide a fake, non-sensitive string representing the structure of this secret.
      placeholder: |
        hf_aBcDeFgHiJkLmNoPqRsTuVwXyZ012345678
    validations:
      required: true
